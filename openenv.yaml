spec_version: 1
name: email-triage-env
description: Deterministic Email Triage environment for spam, priority, and reply tasks.
type: space
runtime: fastapi
app: server:app
port: 7860
entrypoint: server.py
task_types:
  - spam_classification
  - priority_classification
  - reply_drafting

tasks:
  - id: easy_spam_classification
    name: Spam Classification
    description: Classify an email as spam or not_spam.
    difficulty: easy
    grader: graders.grader_easy:grade_easy
  - id: medium_priority_classification
    name: Priority Classification
    description: Classify email priority as low, normal, or urgent.
    difficulty: medium
    grader: graders.grader_medium:grade_medium
  - id: hard_support_reply
    name: Support Reply Drafting
    description: Draft a customer support reply.
    difficulty: hard
    grader: graders.grader_hard:grade_hard
